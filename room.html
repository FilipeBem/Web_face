<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Face — Sala</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=12" />
  <link rel="stylesheet" href="css/room.css?v=12" />
</head>
<body class="room-body">
  <div id="pre-join-gate" class="pre-join-gate">
    <div class="pre-join-card">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M15 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3.5l5 4v-11l-5 4Z"/>
        </svg>
      </div>
      <h2>Antes de entrar na sala</h2>
      <p>O Web Face precisa da sua permissão para usar a câmera e o microfone nesta chamada.</p>
      <button id="ativar-midia-btn" class="btn-primary">Ativar câmera e microfone</button>
      <p id="pre-join-erro" class="footnote hidden" style="color:#f87171; text-align:left;"></p>
    </div>
  </div>

  <div class="room-shell hidden" id="room-shell">
    <header class="room-header">
      <div class="room-header-left">
        <span class="brand-wordmark">Web Face</span>
        <div>
          <h1 id="room-title">Sala</h1>
          <p class="room-sub" id="room-sub"></p>
        </div>
      </div>
      <div class="room-header-right">
        <span id="participant-count" class="participant-count">1 participante</span>
        <button id="copy-link-btn" class="copy-link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 12h6M9 16h6M8 4h8a2 2 0 0 1 2 2v14l-4-3-4 3-4-3-4 3V6a2 2 0 0 1 2-2Z"/>
        </svg>
        Copiar link
      </button>
      </div>
    </header>

    <p id="room-status" class="room-status hidden"></p>

    <div class="room-body-area">
      <main id="video-grid" class="video-grid"></main>

      <aside id="chat-panel" class="chat-panel hidden">
        <div class="chat-panel-header">
          <span>Chat da sala</span>
          <button id="chat-close-btn" class="chat-close-btn" title="Fechar chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="m5 5 14 14M19 5 5 19"/>
            </svg>
          </button>
        </div>
        <ul id="chat-messages" class="chat-messages"></ul>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" placeholder="Escreva uma mensagem..." maxlength="500" autocomplete="off" />
          <button type="submit" class="chat-send-btn" title="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="m3 20 18-8L3 4l0 7 12 1-12 1Z"/>
            </svg>
          </button>
        </form>
      </aside>
    </div>

    <footer class="control-bar">
      <button id="mic-btn" class="ctrl-btn active" title="Microfone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>

      <button id="cam-btn" class="ctrl-btn active" title="Câmera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="6" width="14" height="12" rx="2"/>
          <path d="M22 8.5 16.5 12 22 15.5v-7Z"/>
        </svg>
      </button>

      <button id="screenshare-btn" class="ctrl-btn" title="Compartilhar tela">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="4" width="20" height="13" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </button>

      <button id="chat-btn" class="ctrl-btn" title="Chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 12a8 8 0 1 1-3.4-6.5L21 4l-1 4.6A7.96 7.96 0 0 1 21 12Z"/>
        </svg>
        <span id="chat-badge" class="chat-badge hidden">0</span>
      </button>

      <button id="leave-btn" class="ctrl-btn leave" title="Sair da chamada">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3.5 12.5c0-2 3.8-4 8.5-4s8.5 2 8.5 4c0 .6-.3 1.6-.7 2.1-.4.5-1 .6-1.5.4l-3-1.2c-.4-.2-.6-.6-.6-1v-1a10 10 0 0 0-5.4 0v1c0 .4-.2.8-.6 1l-3 1.2c-.5.2-1.1.1-1.5-.4-.4-.5-.7-1.5-.7-2.1Z"/>
          <path d="m3 3 18 18"/>
        </svg>
      </button>
    </footer>
  </div>

  <div id="tile-backdrop" class="tile-backdrop hidden"></div>

  <div id="volume-menu" class="volume-menu hidden">
    <p id="volume-menu-name" class="volume-menu-name"></p>
    <div class="volume-menu-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 9v6h4l5 5V4L8 9H4Z"/>
        <path d="M17 8a5 5 0 0 1 0 8"/>
      </svg>
      <input id="volume-menu-slider" type="range" min="0" max="100" value="100" />
    </div>
    <button id="volume-menu-mute" class="volume-menu-mute" type="button">Silenciar</button>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/peer-config.js?v=12"></script>
  <script src="js/room.js?v=12"></script>
</body>
</html>
